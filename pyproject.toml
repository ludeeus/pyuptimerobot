[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyuptimerobot"
version = "0"
description = "Python API wrapper for Uptime Robot."
authors = [
    {name = "Joakim Sorensen", email = "hi@ludeeus.dev"},
]
maintainers = [
    {name = "Joakim Sorensen", email = "hi@ludeeus.dev"},
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["homeassistant", "version", "update"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.14.0"
dependencies = [
    "aiohttp>=3.6.1,<4.0",
]

[project.urls]
Repository = "https://github.com/ludeeus/pyuptimerobot"

[project.optional-dependencies]
dev = [
    "aresponses==3.0.0",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "UP046",  # Use PEP 695 type params - keep existing Generic[] style
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["pyuptimerobot"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]

[tool.hatch.build.targets.wheel]
packages = ["pyuptimerobot"]

[tool.hatch.build.targets.sdist]
include = ["pyuptimerobot"]
